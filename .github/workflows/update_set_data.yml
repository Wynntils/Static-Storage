# Github actions runner will run this script on a schedule

name: Update Set Data
on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *' # Runs every hour

jobs:
  update-set-data:
    runs-on: ubuntu-latest
    env:
      WYNNCRAFT_API_KEY: ${{ secrets.WYNNCRAFT_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Update Set Data
        run: |
          chmod +x ./Generators/update_sets.sh
          ./Generators/update_sets.sh

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
            token: ${{ secrets.PRIVATE_TOKEN }}
            labels: auto-generated
            committer: 'WynntilsBot <admin@wynntils.com>'
            author: 'WynntilsBot <admin@wynntils.com>'
            commit-message: "chore: [auto-generated] Update set data from upstream"
            title: "chore: [auto-generated] Update set data from upstream"
            body: |
              Upstream Wynncraft API has been updated with new set data.

              If new field types are introduced, please to not merge this PR until the Wynntils mod has been updated to support these changes.

              This PR has been automatically generated.
            branch: update-set-data
